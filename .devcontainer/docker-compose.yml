services:
  cloudrive-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudrive-dev
    environment:
      NODE_ENV: development
    volumes:
      - ..:/workspaces/cloudrive:cached
      - ${HOME}/.cursor/lib:/root/.cursor/lib
      - ${HOME}/.cursor/skills:/root/.cursor/skills
      - ${HOME}/.cursor/rules:/root/.cursor/rules
      - ${HOME}/.cursor/commands:/root/.cursor/commands
    command: /bin/sh -c "while sleep 1000; do :; done"
