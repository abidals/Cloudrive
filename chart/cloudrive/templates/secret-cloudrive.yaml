{{- $existing := lookup "v1" "Secret" .Release.Namespace "cloudrive-auth" -}}
{{- $sessionSecret := "" -}}
{{- if and $existing $existing.data (index $existing.data "CLOUDRIVE_SESSION_SECRET") -}}
  {{/* data holds base64; decode inside the helper so stringData below
     receives the plain value exactly once */}}
  {{- $sessionSecret = index $existing.data "CLOUDRIVE_SESSION_SECRET" | b64dec -}}
{{- else -}}
  {{- $sessionSecret = randAlphaNum 64 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: cloudrive-auth
  namespace: "{{ .Release.Namespace }}"
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  CLOUDRIVE_SESSION_SECRET: {{ $sessionSecret | quote }}
{{/* Admin bootstrap values always follow the current envs[] values
     (never restored from the secret), so password changes in Settings
     (or at upgrade) reach the app */}}
  CLOUDRIVE_ADMIN_USER: {{ default "admin" .Values.olaresEnv.CLOUDRIVE_ADMIN_USER | quote }}
  CLOUDRIVE_ADMIN_PASSWORD: {{ default "temp-REci2kCSK0" .Values.olaresEnv.CLOUDRIVE_ADMIN_PASSWORD | quote }}